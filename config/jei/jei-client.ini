[appearance]
	# Name: Zentriere Suchleiste
	# Beschreibung: Die JEI-Suchleiste wird unten in der Mitte des Bildschirms angezeigt.
	# Gültige Werte: [true, false]
	# Standardwert: false
	centerSearch = false

	# Name: Max. Rezepthöhe der Benutzeroberfläche
	# Beschreibung: Die maximale Höhe der Rezepte-Benutzeroberfläche.
	# Gültige Werte: Any integer greater than or equal to 175
	# Standardwert: 350
	recipeGuiHeight = 350

	# Name: Toast Reflow
	# Beschreibung: Reserviert Platz für Toast-Benachrichtigungen, damit sie sich nicht mit der JEI-Schnittstelle überschneiden.
	# Gültige Werte: [true, false]
	# Standardwert: true
	toastReflowEnabled = true


[cheating]
	# Name: Item-Aufnahmemodus
	# Beschreibung: Wähle, ob JEI die Items direkt in das Inventar geben soll oder du sie mit der Maus aufnimmst.
	# Gültige Werte: [INVENTORY, MOUSE_PICKUP]
	# Standardwert: MOUSE_PICKUP
	giveMode = MOUSE_PICKUP

	# Name: Cheat Items zu Schnellleiste mit Hotkeys
	# Beschreibung: Aktivieren Sie das Betrügen von Elementen in der Schnellleiste mit Shift + numerischen Schlüsseln.
	# Gültige Werte: [true, false]
	# Standardwert: false
	cheatToHotbarUsingHotkeysEnabled = false

	# Name: Versteckte Zutaten anzeigen
	# Beschreibung: Aktivieren Sie die Anzeige von Zutaten, die nicht im kreativen Menü enthalten sind.
	# Gültige Werte: [true, false]
	# Standardwert: false
	showHiddenIngredients = false

	# Name: Show Tag Rezepte
	# Beschreibung: Zeigen Sie Rezepte für Zutaten-Tags wie Item-Tags und Block-Tags an.
	# Gültige Werte: [true, false]
	# Standardwert: true
	showTagRecipesEnabled = true


[bookmarks]
	# Name: Bookmarks zu Front hinzufügen
	# Beschreibung: Wenn dies wahr ist, fügen Sie neue Lesezeichen an der Vorderseite der Liste hinzu. Wenn Sie falsch sind, fügen Sie sie bis zum Ende hinzu.
	# Gültige Werte: [true, false]
	# Standardwert: false
	addBookmarksToFrontEnabled = false

	# Name: Bookmark Output als Rezept
	# Beschreibung: Wenn dies wahr ist, wird durch Drücken der Lesezeichentaste auf der Ausgabe eines Rezepts das Rezept anstelle der Zutat mit einem Lesezeichen versehen.
	# Gültige Werte: [true, false]
	# Standardwert: true
	bookmarkOutputAsRecipe = true

	# Name: Drag zum Umordnen von Lesezeichen
	# Beschreibung: Aktivieren Sie das Ziehen von Lesezeichen, um sie in der Liste neu anzuordnen.
	# Gültige Werte: [true, false]
	# Standardwert: true
	dragToRearrangeBookmarksEnabled = true


[tooltips]
	# Name: Bookmarks Tooltips Funktionen
	# Beschreibung: Zusätzliche Funktionen für Bookmark Tooltips.
	# Gültige Werte: A comma-separated list containing values of:
	# [PREVIEW, INGREDIENTS]
	# Standardwert: PREVIEW
	bookmarkTooltipFeatures = PREVIEW

	# Name: Keybind für Bookmarks Tooltips
	# Beschreibung: Halten Sie die konfigurierte Taste, um Lesezeichen-Tooltip-Funktionen anzuzeigen.
	# Gültige Werte: [true, false]
	# Standardwert: true
	holdShiftToShowBookmarkTooltipFeatures = true

	# Name: Kreative Tab-Namen anzeigen
	# Beschreibung: Zeigen Sie kreative Tab-Namen in Zutaten-Tooltips.
	# Gültige Werte: [true, false]
	# Standardwert: false
	showCreativeTabNamesEnabled = false

	# Name: Show Tag Inhalte
	# Beschreibung: Zeigen Sie Tag-Inhalte in Tooltips beim Durchsuchen von Rezeptzutaten.
	# Gültige Werte: [true, false]
	# Standardwert: true
	tagContentTooltipEnabled = true

	# Name: Ausblenden Single-Ingredient Tag Inhalte
	# Beschreibung: Tag-Inhalte in Tooltips ausblenden, wenn nur eine Zutat im Tag vorhanden ist.
	# Gültige Werte: [true, false]
	# Standardwert: true
	hideSingleTagContentTooltipEnabled = true

	# Name: Zusammenfassung der Rezeptbestandteile
	# Beschreibung: Zeigen Sie eine Zusammenfassung der Zutaten, die für ein Rezept benötigt werden, auf dem Tooltip der Ausgabezutat.
	# Gültige Werte: [true, false]
	# Standardwert: false
	enableRecipesGuiIngredientsSummary = false


[performance]
	# Name: Low Memory Suche
	# Beschreibung: Stellen Sie die Suche auf den Low-Memory-Modus (macht die Suche langsam, verwendet jedoch weniger RAM).
	# Gültige Werte: [true, false]
	# Standardwert: false
	lowMemorySlowSearchEnabled = false


[lookups]
	# Name: Lookup Fluid Inhalt
	# Beschreibung: Wenn Sie nach Rezepten mit Elementen suchen, die Flüssigkeiten enthalten, suchen Sie auch nach Rezepten für die Flüssigkeiten.
	# Gültige Werte: [true, false]
	# Standardwert: false
	lookupFluidContentsEnabled = false

	# Name: Lookup ItemBlock Tags
	# Beschreibung: Wenn Sie nach Element-Tags suchen, fügen Sie auch Tags für die in den Elementen enthaltenen Standardblöcke hinzu.
	# Gültige Werte: [true, false]
	# Standardwert: true
	lookupBlockTagsEnabled = true


[lookupHistory]
	# Name: Aktiviert
	# Beschreibung: Zeigen oder verstecken Sie das Lookup History Overlay.
	# Gültige Werte: [true, false]
	# Standardwert: false
	enabled = false

	# Name: Max Reihen
	# Beschreibung: Maximale Anzahl der Zeilen, die in der Lookup-Historie angezeigt werden sollen.
	# Gültige Werte: An integer in the range [1, 7] (inclusive)
	# Standardwert: 2
	maxRows = 2

	# Name: Max Zutaten
	# Beschreibung: Max Anzahl der Lookup History Zutaten zu speichern.
	# Gültige Werte: An integer in the range [10, 1000] (inclusive)
	# Standardwert: 100
	maxIngredients = 100

	# Name: Anzeigeseite
	# Beschreibung: Seite des Bildschirms, um das Lookup History Overlay anzuzeigen.
	# Gültige Werte: [LEFT, RIGHT]
	# Standardwert: LEFT
	displaySide = LEFT


[advanced]
	# Name: Fang-Renderfehler
	# Beschreibung: Fangen Sie Renderfehler von modifizierten Zutaten und versuchen Sie, sich von ihnen zu erholen, anstatt abzustürzen.
	# Gültige Werte: [true, false]
	# Standardwert: true
	catchRenderErrorsEnabled = true

	# Name: Rezept Sync Warnung
	# Beschreibung: Zeigen Sie eine Chat-Warnung an, wenn der Server keine synchronisierten Rezepte für JEI bereitstellt (z. B. Vanilla-Server oder Server ohne JEI).
	# Gültige Werte: [true, false]
	# Standardwert: true
	recipeSyncWarningEnabled = true


[input]
	# Name: Verzögerung
	# Beschreibung: Die Anzahl der Millisekunden vor einem langen Mausklick wird als Ziehen der Maus betrachtet.
	# Gültige Werte: An integer in the range [0, 1000] (inclusive)
	# Standardwert: 150
	dragDelayInMilliseconds = 150

	# Name: Glatte Scroll-Rate
	# Beschreibung: Scrollrate zum Scrollen des Mausrads in glatt scrollenden Scrollboxen. Gemessen in Pixeln.
	# Gültige Werte: An integer in the range [1, 50] (inclusive)
	# Standardwert: 9
	smoothScrollRate = 9

	# Name: Rezept Slot Cycling
	# Beschreibung: Automatischer Zyklus durch Zutaten in Rezept-Slots im Laufe der Zeit.
	# Gültige Werte: [true, false]
	# Standardwert: true
	recipeSlotCyclingEnabled = true


[sorting]
	# Name: Inhaltsstoffsortierungsstufen
	# Beschreibung: Sortierreihenfolge für die Zutatenliste.
	# Gültige Werte: A comma-separated list containing values of:
	# [MOD_NAME, INGREDIENT_TYPE, ALPHABETICAL, CREATIVE_MENU, TAG, ARMOR, MAX_DURABILITY]
	# Standardwert: MOD_NAME, INGREDIENT_TYPE, CREATIVE_MENU
	ingredientSortStages = MOD_NAME, INGREDIENT_TYPE, CREATIVE_MENU

	# Name: Sortierphasen
	# Beschreibung: Sortierreihenfolge für angezeigte Rezepte.
	# Gültige Werte: A comma-separated list containing values of:
	# [BOOKMARKED, CRAFTABLE]
	# Standardwert: BOOKMARKED, CRAFTABLE
	recipeSorterStages = BOOKMARKED, CRAFTABLE


[search]
	# Name: @ModName
	# Beschreibung: Suchmodus für den Mod-Namen (Präfix: @)
	# Gültige Werte: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Standardwert: REQUIRE_PREFIX
	modNameSearchMode = REQUIRE_PREFIX

	# Name: #Tag
	# Beschreibung: Suchmodus für den Tag-Namen (Präfix: #)
	# Gültige Werte: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Standardwert: REQUIRE_PREFIX
	tagSearchMode = REQUIRE_PREFIX

	# Name: $Tooltip
	# Beschreibung: Suchmodus für den Tooltip (Präfix: $)
	# Gültige Werte: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Standardwert: ENABLED
	tooltipSearchMode = ENABLED

	# Name: ^Farbe
	# Beschreibung: Suchmodus für die Item-Farben (Präfix: ^)
	# Gültige Werte: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Standardwert: DISABLED
	colorSearchMode = DISABLED

	# Name: &ResourceLocation
	# Beschreibung: Suchmodus für die "ResourceLocation" (prefix: &)
	# Gültige Werte: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Standardwert: DISABLED
	resourceLocationSearchMode = DISABLED

	# Name: %Kategorie
	# Beschreibung: Suchmodus für die Kategorien im Kreativmodus-Inventar (Präfix: %)
	# Gültige Werte: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Standardwert: DISABLED
	creativeTabSearchMode = DISABLED

	# Name: Durchsuche erweiterte Tooltips
	# Beschreibung: Suchen Sie in fortgeschrittenen Tooltips (sichtbar mit F3 + H).
	# Gültige Werte: [true, false]
	# Standardwert: false
	searchAdvancedTooltips = false

	# Name: Suchen Mod-IDs
	# Beschreibung: Suchen Sie Mod-IDs zusätzlich zu Mod-Namen.
	# Gültige Werte: [true, false]
	# Standardwert: true
	searchModIds = true

	# Name: Suche Mod Aliases
	# Beschreibung: Suchen sie mod-aliase (alternative namen), die von plugins hinzugefügt werden, zusätzlich zu mod-namen.
	# Gültige Werte: [true, false]
	# Standardwert: true
	searchModAliases = true

	# Name: Kurze Mod-Namen suchen
	# Beschreibung: Suchen Sie nach den ersten Buchstaben eines Mod-Namens.
	# Gültige Werte: [true, false]
	# Standardwert: false
	searchShortModNames = false

	# Name: Suchen Sie Inhaltsstoff Aliasnamen
	# Beschreibung: Suchen Sie Inhaltsstoffaliase (alternative Namen), die von Plugins zusätzlich zu Inhaltsstoffnamen hinzugefügt werden.
	# Gültige Werte: [true, false]
	# Standardwert: true
	searchIngredientAliases = true


[ingredientList]
	# Name: Max Reihen
	# Beschreibung: Max Anzahl der gezeigten Zeilen.
	# Gültige Werte: An integer in the range [1, 100] (inclusive)
	# Standardwert: 16
	maxRows = 8

	# Name: Maximale Säulen
	# Beschreibung: Maximale Anzahl der gezeigten Spalten.
	# Gültige Werte: An integer in the range [2, 100] (inclusive)
	# Standardwert: 9
	maxColumns = 6

	# Name: Horizontale Ausrichtung
	# Beschreibung: Horizontale Ausrichtung der Zutatenliste innerhalb des verfügbaren Bereichs.
	# Gültige Werte: [LEFT, CENTER, RIGHT]
	# Standardwert: RIGHT
	horizontalAlignment = RIGHT

	# Name: Vertikale Ausrichtung
	# Beschreibung: Vertikale Ausrichtung der Zutatenliste innerhalb des verfügbaren Bereichs.
	# Gültige Werte: [TOP, CENTER, BOTTOM]
	# Standardwert: TOP
	verticalAlignment = TOP

	# Name: Navigationssichtbarkeit
	# Beschreibung: Sichtbarkeit von Navigationssteuerungen wie Seitenschaltflächen und Bildlaufleisten. Verwenden Sie AUTO HIDE, um sie nur anzuzeigen, wenn die Liste überläuft.
	# Gültige Werte: [ENABLED, AUTO_HIDE, DISABLED]
	# Standardwert: ENABLED
	navigationVisibility = ENABLED

	# Name: GUI Hintergrund zeichnen
	# Beschreibung: Aktivieren Sie dies, um eine Hintergrundtextur hinter der Zutatenliste zu zeichnen.
	# Gültige Werte: [true, false]
	# Standardwert: false
	drawBackground = false

	# Name: Layout-Modus
	# Beschreibung: RECTANGULAR hält die Seitennavigation auf das Zutatenraster ausgerichtet, während ausgeschlossene Rasterplätze ausgeschnitten werden können. MAXIMIZE AVAILABLE SPACE kann die Größe ändern und die Seitennavigation um ausgeschlossene Bereiche verschieben.
	# Gültige Werte: [RECTANGULAR, MAXIMIZE_AVAILABLE_SPACE]
	# Standardwert: RECTANGULAR
	layoutMode = RECTANGULAR

	# Name: Navigationsmodus
	# Beschreibung: Wählen Sie PAGED für Seitenschaltflächen, SCROLLING für eine zeilengestufte Scrollleiste oder SMOOTH SCROLLING für eine glatte Scrollleiste.
	# Gültige Werte: [PAGED, SCROLLING, SMOOTH_SCROLLING]
	# Standardwert: PAGED
	navigationMode = PAGED


[bookmarkList]
	# Name: Max Reihen
	# Beschreibung: Max Anzahl der gezeigten Zeilen.
	# Gültige Werte: An integer in the range [1, 100] (inclusive)
	# Standardwert: 16
	maxRows = 8

	# Name: Maximale Säulen
	# Beschreibung: Maximale Anzahl der gezeigten Spalten.
	# Gültige Werte: An integer in the range [2, 100] (inclusive)
	# Standardwert: 9
	maxColumns = 6

	# Name: Horizontale Ausrichtung
	# Beschreibung: Horizontale Ausrichtung der Lesezeichenliste innerhalb des verfügbaren Bereichs.
	# Gültige Werte: [LEFT, CENTER, RIGHT]
	# Standardwert: LEFT
	horizontalAlignment = LEFT

	# Name: Vertikale Ausrichtung
	# Beschreibung: Vertikale Ausrichtung der Lesezeichenliste innerhalb des verfügbaren Bereichs.
	# Gültige Werte: [TOP, CENTER, BOTTOM]
	# Standardwert: TOP
	verticalAlignment = TOP

	# Name: Navigationssichtbarkeit
	# Beschreibung: Sichtbarkeit von Navigationssteuerungen wie Seitenschaltflächen und Bildlaufleisten. Verwenden Sie AUTO HIDE, um sie nur anzuzeigen, wenn die Liste überläuft.
	# Gültige Werte: [ENABLED, AUTO_HIDE, DISABLED]
	# Standardwert: ENABLED
	navigationVisibility = ENABLED

	# Name: GUI Hintergrund zeichnen
	# Beschreibung: Aktivieren Sie dies, um eine Hintergrundtextur hinter der Lesezeichenliste zu zeichnen.
	# Gültige Werte: [true, false]
	# Standardwert: false
	drawBackground = false

	# Name: Layout-Modus
	# Beschreibung: RECTANGULAR hält die Seitennavigation auf das Lesezeichenraster ausgerichtet, während ausgeschlossene Rasterplätze ausgeschnitten werden können. MAXIMIZE AVAILABLE SPACE kann die Größe ändern und die Seitennavigation um ausgeschlossene Bereiche verschieben.
	# Gültige Werte: [RECTANGULAR, MAXIMIZE_AVAILABLE_SPACE]
	# Standardwert: RECTANGULAR
	layoutMode = RECTANGULAR

	# Name: Navigationsmodus
	# Beschreibung: Wählen Sie PAGED für Seitenschaltflächen, SCROLLING für eine zeilengestufte Scrollleiste oder SMOOTH SCROLLING für eine glatte Scrollleiste.
	# Gültige Werte: [PAGED, SCROLLING, SMOOTH_SCROLLING]
	# Standardwert: PAGED
	navigationMode = PAGED


