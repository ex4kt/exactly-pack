# Exactly: verhindert, dass unterschiedliche Vanilla- oder Mod-Strukturen mit ihren echten
# StructureStart-Bounding-Boxes ineinander generieren. Unterirdisch und oberirdisch duerfen
# uebereinander liegen, solange ihre 3D-Bereiche sich nicht schneiden.
